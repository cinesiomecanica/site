<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Enviando…</title>
<style>body{margin:0;display:grid;place-items:center;height:100vh;background:#090d18;color:#aeb7cf;font:15px system-ui}</style></head>
<body><div id="m">Enviando arquivo…</div>
<script>
// Ponte usada só para publicar os vídeos da série no Instagram da Cinesiomecânica:
// baixa um arquivo da pasta "social" do repositório e entrega para a janela do Instagram que abriu esta página.
(async () => {
  const m = document.getElementById('m');
  try {
    const p = new URLSearchParams(location.search), nome = p.get('f') || '';
    if (!/^[\w.-]+\.(mp4|png|jpg)$/.test(nome)) throw new Error('arquivo inválido');
    if (!window.opener) throw new Error('sem janela do Instagram');
    const r = await fetch('https://raw.githubusercontent.com/cinesiomecanica/site/social/' + nome, { cache: 'no-store' });
    if (!r.ok) throw new Error('download ' + r.status);
    const buf = await r.arrayBuffer();
    const type = nome.endsWith('.mp4') ? 'video/mp4' : nome.endsWith('.png') ? 'image/png' : 'image/jpeg';
    window.opener.postMessage({ cmRelay: true, nome, type, buf }, 'https://www.instagram.com', [buf]);
    m.textContent = 'Enviado.'; setTimeout(() => window.close(), 400);
  } catch (e) {
    m.textContent = 'Erro: ' + e.message;
    try { window.opener && window.opener.postMessage({ cmRelay: true, erro: e.message }, 'https://www.instagram.com'); } catch (_) {}
    setTimeout(() => window.close(), 1500);
  }
})();
</script></body></html>
