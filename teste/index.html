/* ===== identidade: instrumento de medição do movimento =====
   Fundo azul-tinta com malha de papel milimetrado; âmbar = medida, seleção e ação; verde-água = eixos.
   Layout: barra superior (marca, seções, busca), camadas à esquerda, ferramentas num só bloco embaixo, painel à direita (folha inferior no celular). */
:root{--bg:#080c18;--bg2:#19223f;--card:#111830;--line:#2e3a66;--ink:#f3f5fb;--ink2:#c0c8dc;--ink3:#939dba;--ac:#f7b84b;--ax:#3fd8cb;--sel:#3fd8cb;--pop:#222d52;--f-d:'Bricolage Grotesque',system-ui,sans-serif;--f-b:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
html,body{font-family:var(--f-b);background:#080c18}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  linear-gradient(#ffffff06 1px,transparent 1px) 0 0/100% 40px,linear-gradient(90deg,#ffffff06 1px,transparent 1px) 0 0/40px 100%,
  radial-gradient(110% 80% at 50% 36%,#1b2647 0%,#0d1326 52%,#070a13 100%)}
#c{z-index:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{flex-wrap:wrap;gap:6px 14px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(#080c18f5 60%,#080c1800)}
.marca{display:flex;align-items:center;gap:7px;font-family:var(--f-d);font-weight:800;font-size:19px;letter-spacing:-.035em}.marca i{color:var(--ac)}
.reg{position:static;flex-direction:row;align-items:center;gap:0;margin-left:6px}
.reg .chip{background:none;border:0;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500;color:var(--ink2);backdrop-filter:none;position:relative;white-space:nowrap}
.reg .chip:hover{color:var(--ink)}
.reg .chip.on{color:var(--ink);font-weight:600}.reg .chip.on::after{content:"";position:absolute;left:12px;right:12px;bottom:1px;height:2.5px;border-radius:2px;background:var(--ac)}
.busca input{border-radius:12px;background:#19223fcc}
.chips{top:calc(72px + env(safe-area-inset-top))}
.chip{background:#222d52d9;font-family:var(--f-b)}
.chips .chip.on{border-color:#4a5a94;color:var(--ink)}.chips .chip:not(.on){color:var(--ink3)}
.ferr{background:#222d52e8;border:1px solid var(--line);border-radius:16px;padding:4px;gap:2px;backdrop-filter:blur(10px);box-shadow:0 8px 30px #0007}
.ferr .chip{background:none;border:0;border-radius:12px;backdrop-filter:none}

<script>/* modo aula: tela cheia, interface ampliada e ponteiro para projetar em sala */
(function(){
  var H=document.documentElement,$=function(i){return document.getElementById(i)},lx=0,ly=0;
  function cheia(){return document.fullscreenElement||document.webkitFullscreenElement}
  function telaCheia(on){try{if(on&&!cheia()){var r=H.requestFullscreen||H.webkitRequestFullscreen;if(r){var pr=r.call(H);if(pr&&pr.catch)pr.catch(function(){});}}else if(!on&&cheia()){var x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document);}}catch(e){}}
  function avisa(t){var el=$('toast');if(!el)return;el.textContent=t;el.classList.add('on');clearTimeout(avisa.h);avisa.h=setTimeout(function(){el.classList.remove('on')},2600);}
  function reajusta(){dispatchEvent(new Event('resize'));}
  function aula(on){H.classList.toggle('aula',on);if(on){telaCheia(true);avisa('Modo aula ligado · P esconde o painel · L liga o ponteiro');}else{telaCheia(false);laser(false);}
    try{sessionStorage.setItem('cm-aula',on?'1':'');}catch(e){}setTimeout(reajusta,60);setTimeout(reajusta,400);}
  function laser(on){H.classList.toggle('laser',on);$('aLaser').classList.toggle('on',on);}
  $('bAula').onclick=function(){aula(!H.classList.contains('aula'));};
  $('aSair').onclick=function(){aula(false);};
  $('aTela').onclick=function(){telaCheia(!cheia());};
  $('aLaser').onclick=function(){laser(!H.classList.contains('laser'));};
  $('aPainel').onclick=function(){var x=$('pX');if($('painel').classList.contains('on')&&x)x.click();else avisa('Toque em um osso ou músculo para abrir o painel de novo');setTimeout(reajusta,320);};
  addEventListener('pointermove',function(e){lx=e.clientX;ly=e.clientY;if(H.classList.contains('laser')){var l=$('laser');l.style.transform='translate('+lx+'px,'+ly+'px)';}},{passive:true});
  addEventListener('keydown',function(e){if(!H.classList.contains('aula')||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||''))return;
    var k=e.key.toLowerCase();if(k==='p')$('aPainel').click();else if(k==='l')$('aLaser').click();else if(k==='f')$('aTela').click();});
  document.addEventListener('fullscreenchange',function(){$('aTela').classList.toggle('on',!!cheia());setTimeout(reajusta,60);});
  try{if(sessionStorage.getItem('cm-aula')==='1')H.classList.add('aula');}catch(e){}
})();</script>

function escolherVersao(v){try{localStorage.setItem('cm-versao',v);}catch(e){}document.documentElement.classList.toggle('cel',v==='cel');document.getElementById('versao').hidden=true;window.dispatchEvent(new CustomEvent('versao',{detail:v}));}
function abrirVersao(){var rec=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||innerWidth<900?'cel':'pc',el=document.getElementById('versao');
  el.querySelectorAll('[data-v]').forEach(function(b){b.classList.toggle('rec',b.dataset.v===rec);b.classList.toggle('atual',document.documentElement.classList.contains('cel')===(b.dataset.v==='cel')&&!!window.__versaoSalva);});el.hidden=false;}
document.getElementById('versao').addEventListener('click',function(e){var b=e.target.closest('[data-v]');if(b){window.__versaoSalva=b.dataset.v;escolherVersao(b.dataset.v);}});
document.getElementById('bVersao').addEventListener('click',abrirVersao);
if(!window.__versaoSalva)abrirVersao();</script>
<script type="module">
/* acesso: só assinantes (ou quem o administrador liberar) carregam o atlas */
import { sb, usuario, temAcesso, carregarDados, sair, minhaAssinatura } from '/conta/conta.js';
const voltar = () => location.replace('/entrar/?volta=' + encodeURIComponent(location.pathname + location.search));
try {
  const u = await usuario();
  if (!u) voltar();
  else if (!(await temAcesso())) location.replace('/entrar/?sem=1');
  else {
    window.__DADOS = await carregarDados();
    // outros arquivos do cofre (por exemplo, tecidos.json), carregados só quando a pessoa abre aquela parte
    window.__conteudo = async nome => { const { data, error } = await sb.storage.from('conteudo').download(nome); if (error) throw error; return JSON.parse(await data.text()); };
    // botão da conta no topo
    const b = document.createElement('button'); b.className = 'vbtn'; b.id = 'bConta'; b.type = 'button';
    b.title = 'Minha conta (' + u.email + ')'; b.setAttribute('aria-label', 'Minha conta');
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
    b.onclick = () => {
      if (document.getElementById('contaBox')) return document.getElementById('contaBox').remove();
      const m = document.createElement('div'); m.id = 'contaBox';
      m.style.cssText = 'position:fixed;top:calc(60px + env(safe-area-inset-top));right:12px;z-index:50;background:#222d52;border:1px solid #2e3a66;border-radius:16px;padding:14px 16px;box-shadow:0 14px 40px #000a;font-size:14px;min-width:220px;color:#f3f5fb';
      m.innerHTML = '<div style="color:#939dba;font-size:12px">Conectado como</div><div style="font-weight:600;margin:2px 0 12px;word-break:break-all"></div><button type="button" style="width:100%;padding:10px;border-radius:12px;background:#f7b84b;color:#1a1203;font-weight:700">Sair da conta</button>';
      m.children[1].textContent = u.email; m.querySelector('button').onclick = () => sair('/');
      document.body.appendChild(m);
      setTimeout(() => addEventListener('pointerdown', function f(e) { if (!m.contains(e.target) && e.target !== b) { m.remove(); removeEventListener('pointerdown', f, true); } }, true), 0);
    };
    const v = document.getElementById('bVersao'); v && v.after(b);
    // teste grátis: selo no topo com os dias que faltam e atalho para os planos
    minhaAssinatura().then(a => {
      if (!a || a.plano !== 'teste') return;
      window.__cmSemAviso = true; import('/conta/medicao.js').then(m => m.cm('abriu_atlas', 'teste')).catch(() => { });
      const fim = new Date(a.valido_ate), resta = fim - Date.now(), dias = Math.max(1, Math.ceil(resta / 864e5));
      const quando = fim.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', ' às');
      const t = document.createElement('button'); t.type = 'button'; t.id = 'bTeste';
      t.style.cssText = 'flex:none;height:38px;padding:0 12px;border-radius:12px;border:1px solid #3fd8cb66;background:#3fd8cb1a;color:#3fd8cb;font:700 13px/1 "Instrument Sans",system-ui,sans-serif;white-space:nowrap;cursor:pointer';
      t.textContent = resta < 864e5 ? 'Teste: último dia' : 'Teste: ' + dias + ' dias';
      if (innerWidth < 600) {
        // no celular o topo não tem espaço: o aviso vira um selo no botão da conta e um bloco dentro do menu dela
        const s = document.createElement('span'); s.textContent = resta < 864e5 ? 'hoje' : dias + 'd';
        s.style.cssText = 'position:absolute;top:-6px;right:-6px;min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:#3fd8cb;color:#04201d;font:800 11px/18px "Instrument Sans",system-ui,sans-serif;text-align:center;pointer-events:none';
        b.style.position = 'relative'; b.style.overflow = 'visible'; b.appendChild(s); b.title = 'Minha conta · teste grátis até ' + quando;
        const abrir = b.onclick;
        b.onclick = () => {
          abrir();
          const m = document.getElementById('contaBox'); if (!m) return;
          const x = document.createElement('div');
          x.style.cssText = 'margin:0 0 12px;padding:12px;border-radius:12px;background:#3fd8cb14;border:1px solid #3fd8cb55;max-width:260px';
          x.innerHTML = '<div style="font-weight:700;color:#3fd8cb">Teste grátis</div><div style="color:#c0c8dc;margin:3px 0 10px;font-size:13px;line-height:1.45">Vai até <b style="color:#f3f5fb"></b>. Sem cobrança no fim: o acesso só para.</div><a href="/#planos" style="display:block;text-align:center;padding:9px;border-radius:10px;border:1px solid #f7b84b;color:#f7b84b;font-weight:700;text-decoration:none">Ver os planos</a>';
          x.querySelector('b').textContent = quando; m.insertBefore(x, m.querySelector('button'));
        };
        return;
      }
      t.title = 'Teste grátis até ' + quando;
      t.onclick = () => {
        const old = document.getElementById('testeBox'); if (old) return old.remove();
        const m = document.createElement('div'); m.id = 'testeBox';
        m.style.cssText = 'position:fixed;top:calc(60px + env(safe-area-inset-top));right:12px;left:auto;z-index:50;max-width:300px;background:#222d52;border:1px solid #2e3a66;border-radius:16px;padding:16px;box-shadow:0 14px 40px #000a;font:14px/1.45 "Instrument Sans",system-ui,sans-serif;color:#f3f5fb';
        m.innerHTML = '<div style="font-weight:700;font-size:15px">Seu teste grátis</div><div style="color:#c0c8dc;margin:4px 0 12px">Vai até <b style="color:#f3f5fb"></b>. Sem cobrança no fim: o acesso só para. Para continuar com tudo, escolha um plano com este mesmo e-mail.</div><a href="/#planos" style="display:block;text-align:center;padding:11px;border-radius:12px;background:#f7b84b;color:#1a1203;font-weight:700;text-decoration:none">Ver os planos</a>';
        m.querySelector('b').textContent = quando; document.body.appendChild(m);
        setTimeout(() => addEventListener('pointerdown', function f(e) { if (!m.contains(e.target) && e.target !== t) { m.remove(); removeEventListener('pointerdown', f, true); } }, true), 0);
      };
      (v || b).before(t);
    }).catch(() => { });
    await import('/teste/app.js');
  }
} catch (e) { console.error(e); document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;inset:0;display:grid;place-items:center;background:#080c18;color:#f3f5fb;font:16px system-ui;z-index:99;text-align:center;padding:24px">Não foi possível carregar o conteúdo.<br>Verifique sua conexão e tente de novo.<br><br><a href="/entrar/" style="color:#f7b84b">Entrar de novo</a></div>'); }
</script>
</body>
</html>
